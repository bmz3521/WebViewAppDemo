<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Membership Landing – Test</title>
  <style>
    :root {
      --bg: #F8F9FA;
      --text: #1A1A1A;
      --muted: #666;
      --card-bg: #FFF;
      --accent: #0066FF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #F5F5F5;
        --muted: #999;
        --card-bg: #1E1E1E;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .hero { text-align: center; margin-bottom: 32px; }
    .hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .hero p  { font-size: 15px; color: var(--muted); margin-top: 6px; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      margin-bottom: 32px;
    }
    .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 12px; }
    .link-list { list-style: none; }
    .link-list li + li { margin-top: 10px; }
    .link-list a {
      display: block;
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: opacity .15s;
    }
    .link-list a:active { opacity: .7; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--accent);
      color: #FFF;
      margin-left: 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Membership Demo</h1>
    <p>Landing page for in-app WebView testing</p>
  </div>

  <div class="card">
    <h2>Test Links</h2>
    <ul class="link-list">
      <li><a href="embed.html">Embedded view (no nav) <span class="badge">primary</span></a></li>
      <li><a href="embed.html?app_embed=1">Embedded + query param</a></li>
    </ul>
  </div>
</body>
</html>
